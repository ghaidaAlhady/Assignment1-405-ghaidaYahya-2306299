<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 6 - Like or Dislike</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Lab 6</h1>
        <h2>Like or dislike</h2>

        <div class="vote-buttons">
            <button id="like-button" type="button" aria-label="Like">
                <span aria-hidden="true">👍</span><span id="like-count">100</span>
            </button>
            <button id="dislike-button" type="button" aria-label="Dislike">
                <span aria-hidden="true">👎</span><span id="dislike-count">20</span>
            </button>
        </div>

        <h3>Comments</h3>
        <form id="comment-form">
            <textarea id="comment-input" placeholder="Write a comment..." aria-label="Write a comment"></textarea>
            <div class="form-buttons">
                <button type="submit">Submit</button>
                <button type="button" id="reset-button">Clear</button>
            </div>
        </form>
        <p id="message" role="status" aria-live="polite"></p>
        <div id="comments-list" aria-label="Submitted comments"></div>
    </main>
    <script src="script.js"></script>
</body>
</html>
